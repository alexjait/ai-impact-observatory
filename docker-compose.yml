services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_impact_observatory_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_impact_observatory_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_impact_observatory_dev}?schema=public
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-aiio_session}
      SOCIAL_SIGNUP_COOKIE_NAME: ${SOCIAL_SIGNUP_COOKIE_NAME:-aiio_social_signup}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
      AUTH_FLOW_TTL_MINUTES: ${AUTH_FLOW_TTL_MINUTES:-15}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/v1/auth/google/callback}
      AUTH_CONFLICT_PATH: ${AUTH_CONFLICT_PATH:-/auth/conflict}
      SOCIAL_SIGNUP_PATH: ${SOCIAL_SIGNUP_PATH:-/auth/social/complete}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-mymemory}
      TRANSLATION_API_BASE_URL: ${TRANSLATION_API_BASE_URL:-https://api.mymemory.translated.net}
      TRANSLATION_CONTACT_EMAIL: ${TRANSLATION_CONTACT_EMAIL:-}
      SEED_CSV_PATH: ${SEED_CSV_PATH:-/docs/seed_portal_impacto_ia_bilingue_tres_evidencias_corregido.csv}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./docs:/docs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend-web
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://backend:3001/api/v1}
        SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-aiio_session}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://backend:3001/api/v1}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-aiio_session}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
